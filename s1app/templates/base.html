{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Adhyayan Publisher  Distributor
        {% endblock %}
    </title>

    <!-- WhatsApp -->
    <link rel="stylesheet" href="{% static 'css/whatsapp.css' %}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Page-specific CSS -->
    {% block css %}
    {% endblock %}

</head>

<body>

    <!-- Navbar -->
    {% include 'includes/navbar.html' %}

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'includes/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="{% static 'js/script.js' %}"></script>

    {% block js %}
    {% endblock %}

    <!-- WhatsApp -->
    <a href="https://wa.me/7217824443"
       class="whatsapp-float"
       target="_blank"
       aria-label="Contact us on WhatsApp">

        <i class="bi bi-whatsapp"></i>

    </a>

</body>
</html>
